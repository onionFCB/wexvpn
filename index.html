<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const SUPABASE_URL = 'https://uwasaxshladsssvkooof.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__-cdz___wVbGrgOVPn6plw_zVM5Zyel';
    
    const user = tg.initDataUnsafe?.user;
    const userId = user?.id || 'guest';
    const username = user?.username || user?.first_name || 'Юзер';
    const BOT_USERNAME = 'wex7vpnbot';
    const refLink = `https://t.me/${BOT_USERNAME}?start=ref${userId}`;
    document.getElementById('refLink').innerText = refLink;

    // Загружаем данные из Supabase
    async function loadUser() {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/users?user_id=eq.${userId}`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            const data = await res.json();
            if (data.length > 0) {
                const u = data[0];
                document.getElementById('balanceDisplay').innerText = u.balance_days + ' дней';
                document.getElementById('refCount').innerText = u.ref_count || 0;
                document.getElementById('bonusDays').innerText = u.bonus_days || 0;
            } else {
                // Создаём юзера
                await createUser();
                document.getElementById('balanceDisplay').innerText = '7 дней (пробный)';
            }
        } catch(e) {
            console.log('База не подключена');
            document.getElementById('balanceDisplay').innerText = '7 дней (пробный)';
        }
    }

    async function createUser() {
        const newUser = {
            user_id: userId,
            username: username,
            plan: 'trial',
            trial_end: new Date(Date.now() + 7*24*60*60*1000).toISOString(),
            key: 'WEX-TRIAL-' + userId.toString().slice(-6),
            balance_days: 7,
            ref_code: 'ref' + userId,
            ref_count: 0,
            bonus_days: 0
        };
        await fetch(`${SUPABASE_URL}/rest/v1/users`, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify(newUser)
        });
    }

    loadUser();

    function showMainScreen() {
        document.getElementById('welcomeScreen').classList.remove('active');
        document.getElementById('mainScreen').classList.add('active');
    }

    function openSupport() { tg.openTelegramLink('https://t.me/pan1ca7'); }

    function buyElite() {
        tg.showPopup({
            title: 'ELITE 249₽',
            message: '⭐ Stars: отправь 250 Stars боту\n💳 Карта: 2200 XXXX XXXX XXXX',
            buttons: [{id:'stars', text:'⭐ Stars'}, {id:'card', text:'💳 Карта'}, {type:'cancel'}]
        }, (btn) => {
            if(btn === 'stars') tg.showPopup({title:'Stars', message:'Отправь 250 Stars боту @' + BOT_USERNAME});
            if(btn === 'card') tg.showPopup({title:'Карта', message:'Переведи 249₽ и напиши /paid'});
        });
    }

    function startSetup() {
        tg.showPopup({
            title: 'Выбери платформу',
            message: 'На чём будешь использовать VPN?',
            buttons: [{id:'ios', text:'iOS'}, {id:'android', text:'Android'}, {id:'windows', text:'Windows'}, {id:'linux', text:'Linux'}, {type:'cancel'}]
        }, (platform) => {
            if (!platform || platform === 'cancel') return;
            chooseAudience(platform);
        });
    }

    function chooseAudience(platform) {
        tg.showPopup({
            title: 'Для кого настройка?',
            message: 'Выбери вариант',
            buttons: [{id:'self', text:'Для себя'}, {id:'other', text:'Для кого-то'}, {type:'cancel'}]
        }, (audience) => {
            if (!audience || audience === 'cancel') return;
            askHapp(platform, audience);
        });
    }

    function askHapp(platform, audience) {
        tg.showPopup({
            title: 'Скажи "Happ"',
            message: 'Введи "Happ" чтобы продолжить',
            buttons: [{id:'happ', text:'Happ'}, {id:'skip', text:'Пропустить'}, {type:'cancel'}]
        }, (choice) => {
            if (choice === 'happ' || choice === 'skip') {
                let link = '';
                if (platform === 'ios') link = 'https://apps.apple.com/app/happ-vpn/id1587873487';
                else if (platform === 'android') link = 'https://play.google.com/store/apps/details?id=com.happvpn';
                else if (platform === 'windows') link = 'https://happvpn.com/windows';
                else link = 'https://happvpn.com/linux';
                
                tg.showPopup({
                    title: 'Готово',
                    message: audience === 'self' ? 'Сейчас откроется Happ VPN.' : 'Отправь ссылку другу.',
                    buttons: [{id:'connect', text:'🔗 Подключиться'}]
                }, (final) => {
                    if (final === 'connect' && link) tg.openLink(link);
                });
            }
        });
    }

    function copyRef() {
        navigator.clipboard.writeText(refLink);
        tg.showPopup({title:'Скопировано', message:'Отправь другу и получи месяц ELITE!'});
    }
</script>
